  <circle cx="100" cy="88" r="40" fill="none" stroke="#1A1A1A" stroke-width="6" stroke-dasharray="8 5"/>
  <circle cx="100" cy="88" r="26" fill="#1A1A1A"/>
  <circle cx="100" cy="88" r="11" fill="#F5A623"/>

  <!-- Dientes del engranaje -->
  <rect x="92" y="42" width="16" height="20" rx="4" fill="#1A1A1A"/>
  <rect x="92" y="114" width="16" height="20" rx="4" fill="#1A1A1A"/>
  <rect x="54" y="80" width="20" height="16" rx="4" fill="#1A1A1A"/>
  <rect x="126" y="80" width="20" height="16" rx="4" fill="#1A1A1A"/>
  <rect x="63" y="53" width="16" height="20" rx="4" fill="#1A1A1A" transform="rotate(45 71 63)"/>
  <rect x="120" y="103" width="16" height="20" rx="4" fill="#1A1A1A" transform="rotate(45 128 113)"/>
  <rect x="63" y="103" width="16" height="20" rx="4" fill="#1A1A1A" transform="rotate(-45 71 113)"/>
  <rect x="120" y="53" width="16" height="20" rx="4" fill="#1A1A1A" transform="rotate(-45 128 63)"/>

