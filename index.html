<body>
    <div id="app">
        <div style="position:fixed;inset:0;background:#1A1A1A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;font-family:sans-serif;">
            <div style="width:64px;height:64px;background:#F5A623;border-radius:12px;display:flex;align-items:center;justify-content:center;">
                <span style="font-family:Arial Black,sans-serif;font-weight:900;font-size:26px;color:#1A1A1A">SF</span>
            </div>
            <div style="text-align:center">
                <p style="color:#F5A623;font-size:14px;letter-spacing:3px;text-transform:uppercase;margin-bottom:4px">Refacciones San Felipe</p>
                <p style="color:rgba(255,255,255,.35);font-size:12px">Cargando...</p>
            </div>
            <div style="width:140px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;">
                <div style="width:40%;height:100%;background:#F5A623;border-radius:2px;animation:load 1.2s ease-in-out infinite alternate;"></div>
            </div>
        </div>
    </div>
    <div id="blazor-error-ui" style="display:none;background:#7b1c1c;color:white;padding:1rem;position:fixed;bottom:0;left:0;right:0;z-index:9999;font-family:sans-serif">
        Se produjo un error no manejado.
        <a href="" style="color:#F5A623">Recargar</a>
        <a onclick="document.getElementById('blazor-error-ui').style.display='none'" style="float:right;color:#F5A623;cursor:pointer">✕</a>
    </div>
    <style>
        @keyframes load {
            from {
                transform: translateX(-100%);
            }

            to {
                transform: translateX(250%);
            }
        }
    </style>
    <script src="_framework/blazor.webassembly.js"></script>
